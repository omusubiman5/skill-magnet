[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-magnet"
version = "0.2.0"
description = "Manually launch verified GitHub skill-pack tasks with fail-closed evidence."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
skill-magnet = "skill_magnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
