[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-magnet"
version = "0.1.0"
description = "Safely distribute Git-managed skill packs to Codex and Claude Code."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
skill-magnet = "skill_magnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
