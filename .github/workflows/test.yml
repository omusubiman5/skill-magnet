name: Skill Magnet tests

on:
  push:
  pull_request:

jobs:
  cross-platform-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/powershell/certificate-state-tests.ps1
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./native/windows-modern-context-menu/build.ps1 -OutDir ./native/windows-modern-context-menu/out -SkipContractTest
