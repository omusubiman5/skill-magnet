name: Skill Magnet tests

on:
  push:
  pull_request:

jobs:
  cross-platform-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - if: runner.os == 'Windows'
        name: Parse every PowerShell script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failures = @()
          foreach ($script in @(Get-ChildItem -LiteralPath . -Recurse -File -Filter "*.ps1")) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            foreach ($error in @($errors)) {
              $failures += "$($script.FullName):$($error.Extent.StartLineNumber): $($error.Message)"
            }
          }
          if ($failures.Count -gt 0) {
            throw ($failures -join "`n")
          }
          Write-Output "Windows PowerShell 5.1 parser PASS"
      - run: python -m pip install -e .
      - if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - if: runner.os == 'Windows'
        name: Install standalone wheel candidate
        shell: pwsh
        run: |
          $wheelDir = Join-Path $env:RUNNER_TEMP "skill-magnet-wheel"
          python -m pip wheel . --no-deps --wheel-dir $wheelDir
          $wheels = @(Get-ChildItem -LiteralPath $wheelDir -Filter "skill_magnet-*.whl")
          if ($wheels.Count -ne 1) { throw "Expected exactly one candidate wheel." }
          $wheel = $wheels[0]
          python -m pip install --force-reinstall $wheel.FullName
          $modulePath = python -c "import pathlib,skill_magnet; print(pathlib.Path(skill_magnet.__file__).resolve())"
          if ($modulePath.StartsWith($env:GITHUB_WORKSPACE, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Release lifecycle still imports the repository checkout: $modulePath"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SKILL_MAGNET_WHEEL=$($wheel.FullName)"
      - if: runner.os == 'macOS'
        name: Install standalone wheel candidate
        shell: zsh {0}
        run: |
          wheel_dir="${RUNNER_TEMP}/skill-magnet-wheel"
          python -m pip wheel . --no-deps --wheel-dir "${wheel_dir}"
          wheel=("${wheel_dir}"/skill_magnet-*.whl)
          python -m pip install --force-reinstall "${wheel[1]}"
          module_path="$(python -c 'import pathlib,skill_magnet; print(pathlib.Path(skill_magnet.__file__).resolve())')"
          [[ "${module_path}" != "${GITHUB_WORKSPACE}"/* ]] || {
            print -u2 "Release lifecycle still imports the repository checkout: ${module_path}"
            exit 1
          }
          print "SKILL_MAGNET_WHEEL=${wheel[1]}" >> "${GITHUB_ENV}"
      - name: Preserve standalone wheel candidate
        uses: actions/upload-artifact@v7
        with:
          name: standalone-wheel-${{ runner.os }}
          path: ${{ runner.temp }}/skill-magnet-wheel/*.whl
          if-no-files-found: error
      - if: runner.os == 'Windows'
        name: Gate candidate SHA, wheel payload, and signed Explorer field evidence
        shell: pwsh
        run: >-
          python integration/explorer_results_gate.py
          docs/windows-explorer-leaf-launch-results.md
          --release-profile windows_mvp
          --wheel "$env:SKILL_MAGNET_WHEEL"
          --invoke-log docs/evidence/windows-explorer-direct-root-0.5.9.log
          --field-evidence docs/evidence/windows-explorer-direct-root-0.5.9.json
      - if: runner.os != 'Windows'
        name: Gate cross-platform candidate SHA and standalone wheel payload
        shell: bash
        run: >-
          python integration/explorer_results_gate.py
          docs/windows-explorer-leaf-launch-results.md
          --wheel "${SKILL_MAGNET_WHEEL}"
          --cross-platform-artifact-only
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/powershell/certificate-state-tests.ps1
      - if: runner.os == 'Windows'
        name: Build native binaries from installed wheel
        shell: pwsh
        run: |
          $native = python -c "from skill_magnet.platforms import _windows_modern_paths; print(_windows_modern_paths()[0])"
          $nonce = [guid]::NewGuid().ToString("N")
          $workspace = Join-Path $env:RUNNER_TEMP ("skill-magnet-native-build-" + $nonce)
          $nativeOut = Join-Path $workspace "out"
          New-Item -ItemType Directory -Path $nativeOut | Out-Null
          $markerJson = python -c 'import json,sys; from pathlib import Path; from skill_magnet.platforms import _windows_handle_identity; root=_windows_handle_identity(Path(sys.argv[1]),directory=True); output=_windows_handle_identity(Path(sys.argv[2]),directory=True); print(json.dumps({"schema_version":1,"contract":"skill-magnet-native-build-workspace-v1","nonce":sys.argv[3],"volume_serial":root["volume_serial"],"root_file_id":root["file_id"],"output_file_id":output["file_id"]},sort_keys=True,separators=(",",":")))' $workspace $nativeOut $nonce
          $markerBytes = [System.Text.UTF8Encoding]::new($false).GetBytes($markerJson + "`n")
          [System.IO.File]::WriteAllText(
            (Join-Path $workspace ".skill-magnet-native-build.json"),
            ($markerJson + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )
          $markerSha256 = [Convert]::ToHexString(
            [System.Security.Cryptography.SHA256]::HashData($markerBytes)
          ).ToLowerInvariant()
          & (Join-Path $native "build.ps1") `
            -OutDir $nativeOut `
            -BuildNonce $nonce `
            -MarkerSha256 $markerSha256 `
            -SkipContractTest
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          SKILL_MAGNET_ALLOW_DESTRUCTIVE_LIFECYCLE: "1"
          SKILL_MAGNET_SKIP_NATIVE_CONTRACT_TEST: "1"
        run: ./tests/powershell/windows-release-lifecycle-tests.ps1
      - if: runner.os == 'macOS'
        shell: zsh {0}
        run: zsh ./tests/macos/finder-release-lifecycle-tests.sh
